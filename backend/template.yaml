AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: CloudOps - Plataforma de Conexão e Pesquisa Científica

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Ambiente de deploy
  
  FrontendBucketName:
    Type: String
    Default: cloudops-frontend
    Description: Nome do bucket S3 para o frontend

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs18.x
    MemorySize: 256
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        USERS_TABLE: !Ref UsersTable
        PESQUISAS_TABLE: !Ref PesquisasTable
        MATCHES_TABLE: !Ref MatchesTable
        NOTIFICATION_TOPIC_ARN: !Ref NotificationTopic
        USER_POOL_ID: !Ref CognitoUserPool
    Tracing: Active

Resources:
  # ============================================
  # COGNITO - Autenticação
  # ============================================
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub cloudops-users-${Environment}
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: userType
          AttributeDataType: String
          Mutable: true

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub cloudops-client-${Environment}
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
        - COGNITO

  # ============================================
  # API GATEWAY
  # ============================================
  CloudOpsApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub cloudops-api-${Environment}
      StageName: !Ref Environment
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
        AllowCredentials: false
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt CognitoUserPool.Arn

  # ============================================
  # DYNAMODB TABLES
  # ============================================
  UsersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cloudops-users-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: userId
          AttributeType: S
        - AttributeName: email
          AttributeType: S
        - AttributeName: tipoUsuario
          AttributeType: S
      KeySchema:
        - AttributeName: userId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - AttributeName: email
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: tipo-index
          KeySchema:
            - AttributeName: tipoUsuario
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  PesquisasTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cloudops-pesquisas-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pesquisaId
          AttributeType: S
        - AttributeName: professorId
          AttributeType: S
        - AttributeName: status
          AttributeType: S
      KeySchema:
        - AttributeName: pesquisaId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: professor-index
          KeySchema:
            - AttributeName: professorId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: status-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  MatchesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub cloudops-matches-${Environment}
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: matchId
          AttributeType: S
        - AttributeName: visitorId
          AttributeType: S
        - AttributeName: pesquisaId
          AttributeType: S
      KeySchema:
        - AttributeName: matchId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: user-index
          KeySchema:
            - AttributeName: visitorId
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: pesquisa-index
          KeySchema:
            - AttributeName: pesquisaId
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # ============================================
  # S3 - Frontend Hosting
  # ============================================
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${FrontendBucketName}-${Environment}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, HEAD]
            AllowedOrigins: ['*']
            MaxAge: 3600

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*

  # ============================================
  # CLOUDFRONT - CDN
  # ============================================
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: ApiOrigin
            DomainName: !Sub ${CloudOpsApi}.execute-api.${AWS::Region}.amazonaws.com
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            ForwardedValues:
              QueryString: true
              Headers:
                - Authorization
                - Content-Type
              Cookies:
                Forward: all
            MinTTL: 0
            DefaultTTL: 0
            MaxTTL: 0
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
        PriceClass: PriceClass_100

  # ============================================
  # SNS - Notificações
  # ============================================
  NotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub cloudops-notifications-${Environment}
      DisplayName: CloudOps Notifications

  # ============================================
  # SQS - Fila para processamento de matches
  # ============================================
  MatchProcessingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub cloudops-match-queue-${Environment}
      VisibilityTimeout: 300
      MessageRetentionPeriod: 86400
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt MatchDeadLetterQueue.Arn
        maxReceiveCount: 3

  MatchDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub cloudops-match-dlq-${Environment}
      MessageRetentionPeriod: 1209600

  # ============================================
  # LAMBDA FUNCTIONS
  # ============================================
  
  # Auth Function (sem autenticação)
  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cloudops-auth-${Environment}
      CodeUri: lambda/api/
      Handler: auth.handler
      Events:
        Register:
          Type: Api
          Properties:
            RestApiId: !Ref CloudOpsApi
            Path: /auth/register
            Method: post
            Auth:
              Authorizer: NONE
        Login:
          Type: Api
          Properties:
            RestApiId: !Ref CloudOpsApi
            Path: /auth/login
            Method: post
            Auth:
              Authorizer: NONE
        ConfirmEmail:
          Type: Api
          Properties:
            RestApiId: !Ref CloudOpsApi
            Path: /auth/confirm
            Method: post
            Auth:
              Authorizer: NONE
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:AdminConfirmSignUp
                - cognito-idp:SignUp
                - cognito-idp:ConfirmSignUp
                - cognito-idp:InitiateAuth
              Resource: !GetAtt CognitoUserPool.Arn

  CadastroPerfilFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cloudops-perfil-${Environment}
      CodeUri: lambda/api/
      Handler: perfil.handler
      Events:
        CreateProfile:
          Type: Api
          Properties:
            RestApiId: !Ref CloudOpsApi
            Path: /perfil
            Method: post
        GetProfile:
          Type: Api
          Properties:
            RestApiId: !Ref CloudOpsApi
            Path: /perfil/{userId}
            Method: get
        UpdateProfile:
          Type: Api
          Properties:
            RestApiId: !Ref CloudOpsApi
            Path: /perfil/{userId}
            Method: put
        ListProfiles:
          Type: Api
          Properties:
            RestApiId: !Ref CloudOpsApi
            Path: /perfis
            Method: get
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

  CadastroPesquisaFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cloudops-pesquisa-${Environment}
      CodeUri: lambda/api/
      Handler: pesquisa.handler
      Events:
        CreatePesquisa:
          Type: Api
          Properties:
            RestApiId: !Ref CloudOpsApi
            Path: /pesquisa
            Method: post
        GetPesquisa:
          Type: Api
          Properties:
            RestApiId: !Ref CloudOpsApi
            Path: /pesquisa/{pesquisaId}
            Method: get
        UpdatePesquisa:
          Type: Api
          Properties:
            RestApiId: !Ref CloudOpsApi
            Path: /pesquisa/{pesquisaId}
            Method: put
        DeletePesquisa:
          Type: Api
          Properties:
            RestApiId: !Ref CloudOpsApi
            Path: /pesquisa/{pesquisaId}
            Method: delete
        ListPesquisas:
          Type: Api
          Properties:
            RestApiId: !Ref CloudOpsApi
            Path: /pesquisas
            Method: get
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PesquisasTable
        - SQSSendMessagePolicy:
            QueueName: !GetAtt MatchProcessingQueue.QueueName

  MatchingEngineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cloudops-matching-${Environment}
      CodeUri: lambda/api/
      Handler: matching.handler
      Timeout: 120
      MemorySize: 512
      Events:
        FindMatches:
          Type: Api
          Properties:
            RestApiId: !Ref CloudOpsApi
            Path: /matches/{pesquisaId}
            Method: get
        ProcessMatchQueue:
          Type: SQS
          Properties:
            Queue: !GetAtt MatchProcessingQueue.Arn
            BatchSize: 1
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable
        - DynamoDBCrudPolicy:
            TableName: !Ref PesquisasTable
        - DynamoDBCrudPolicy:
            TableName: !Ref MatchesTable
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotificationTopic.TopicName

  NotificacoesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub cloudops-notificacoes-${Environment}
      CodeUri: lambda/api/
      Handler: notificacoes.handler
      Events:
        SendNotification:
          Type: Api
          Properties:
            RestApiId: !Ref CloudOpsApi
            Path: /notificacao
            Method: post
        GetNotificacoes:
          Type: Api
          Properties:
            RestApiId: !Ref CloudOpsApi
            Path: /notificacoes
            Method: get
        SNSTrigger:
          Type: SNS
          Properties:
            Topic: !Ref NotificationTopic
      Policies:
        - SNSPublishMessagePolicy:
            TopicName: !GetAtt NotificationTopic.TopicName
        - DynamoDBCrudPolicy:
            TableName: !Ref UsersTable

  # ============================================
  # CLOUDWATCH - Logs e Monitoramento
  # ============================================
  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/apigateway/cloudops-${Environment}
      RetentionInDays: 30

  # ============================================
  # CLOUDWATCH ALARMS
  # ============================================
  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub cloudops-api-errors-${Environment}
      MetricName: 5XXError
      Namespace: AWS/ApiGateway
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: ApiName
          Value: !Sub cloudops-api-${Environment}

# ============================================
# OUTPUTS
# ============================================
Outputs:
  ApiUrl:
    Description: URL da API
    Value: !Sub "https://${CloudOpsApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}"
    Export:
      Name: !Sub ${AWS::StackName}-ApiUrl

  CloudFrontUrl:
    Description: URL do CloudFront
    Value: !Sub "https://${CloudFrontDistribution.DomainName}"
    Export:
      Name: !Sub ${AWS::StackName}-CloudFrontUrl

  FrontendBucketName:
    Description: Nome do bucket S3 do frontend
    Value: !Ref FrontendBucket
    Export:
      Name: !Sub ${AWS::StackName}-FrontendBucket

  UserPoolId:
    Description: ID do Cognito User Pool
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolId

  UserPoolClientId:
    Description: ID do Cognito User Pool Client
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub ${AWS::StackName}-UserPoolClientId

  UsersTableName:
    Description: Nome da tabela de usuários
    Value: !Ref UsersTable

  PesquisasTableName:
    Description: Nome da tabela de pesquisas
    Value: !Ref PesquisasTable

  MatchesTableName:
    Description: Nome da tabela de matches
    Value: !Ref MatchesTable

  NotificationTopicArn:
    Description: ARN do tópico SNS
    Value: !Ref NotificationTopic
