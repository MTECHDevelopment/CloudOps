<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CloudOps</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/enhancements.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-cloud"></i>
            <span>CloudOps</span>
        </div>
        <h1>Bem-vindo de volta!</h1>
        <p>Entre para continuar conectando-se com pesquisadores</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seu.email@exemplo.com">
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <div class="password-input">
                    <input type="password" id="senha" required placeholder="Sua senha">
                    <button type="button" class="toggle-password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>
        </form>
        
        <div class="login-divider">ou</div>
        
        <a href="cadastro-perfil.html" class="btn btn-outline">
            <i class="fas fa-user-plus"></i> Criar nova conta
        </a>
        
        <div class="login-footer">
            <a href="#">Esqueceu sua senha?</a>
        </div>
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        // Se já estiver autenticado, redirecionar para perfil
        if (Auth.isAuthenticated()) {
            window.location.href = 'perfil.html';
        }

        // Toggle de senha
        document.querySelector('.toggle-password').addEventListener('click', function() {
            const input = document.getElementById('senha');
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('fa-eye', 'fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('fa-eye-slash', 'fa-eye');
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const submitBtn = this.querySelector('button[type="submit"]');
            
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Entrando...';

            try {
                // Em produção, usar a API real
                // const response = await api.login({ email, password: senha });

                // Mock de login para demonstração
                const mockResponse = {
                    accessToken: 'mock-token-' + Date.now(),
                    refreshToken: 'mock-refresh-token',
                    userId: 'user-' + Date.now()
                };
                
                const mockUser = {
                    userId: mockResponse.userId,
                    email: email,
                    nome: 'Usuário Demo',
                    tipoUsuario: 'aluno'
                };

                // Salvar dados de autenticação
                Auth.saveAuthData(mockResponse, mockUser);

                // Redirecionar para perfil (ou URL salva)
                Auth.redirectAfterLogin();

            } catch (error) {
                console.error('Erro no login:', error);
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Entrar';
                alert('Erro ao fazer login. Verifique suas credenciais.');
            }
        });
    </script>
</body>
</html>
