<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - CloudOps</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="logo">
            <i class="fas fa-cloud"></i>
            <span>CloudOps</span>
        </div>
        <h1>Bem-vindo de volta!</h1>
        <p>Entre para continuar conectando-se com pesquisadores</p>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" required placeholder="seu.email@exemplo.com">
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <div class="password-input">
                    <input type="password" id="senha" required placeholder="Sua senha">
                    <button type="button" class="toggle-password">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary btn-lg">
                <i class="fas fa-sign-in-alt"></i> Entrar
            </button>
        </form>
        
        <div class="login-divider">ou</div>
        
        <a href="cadastro-perfil.html" class="btn btn-outline">
            <i class="fas fa-user-plus"></i> Criar nova conta
        </a>
        
        <div class="login-footer">
            <a href="#">Esqueceu sua senha?</a>
        </div>
    </div>
    
    <script src="js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Simular login - redirecionar para dashboard
            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
