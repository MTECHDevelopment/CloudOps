version: 1

# Build-time environment variables (public, safe to commit)
# These are available during the build process
env:
  variables:
    AWS_REGION: us-west-2
    # Do NOT put secrets here!

frontend:
  phases:
    preBuild:
      commands:
        - npm install
        - echo "Installing Amplify dependencies..."
    build:
      commands:
        - npx @aws-amplify/backend-cli generate outputs --branch $AWS_BRANCH --app-id $AWS_APP_ID
  artifacts:
    baseDirectory: frontend
    files:
      - '**/*'
      - amplify_outputs.json
  cache:
    paths:
      - node_modules/**/*

backend:
  phases:
    build:
      commands:
        # Build Amplify backend
        - cd amplify
        - npm install
        # Install Lambda function dependencies
        - cd functions/rds-connector
        - npm install
        - cd ../..
        # Deploy backend
        - npx @aws-amplify/backend-cli pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
