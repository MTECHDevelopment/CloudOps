version: 1
backend:
  phases:
    build:
      commands:
        - echo "Setting up SAM backend..."
        - cd backend && sam build
    postBuild:
      commands:
        - echo "Deploying backend..."
        - sam deploy --no-confirm-changeset --no-fail-on-empty-changeset
frontend:
  phases:
    preBuild:
      commands:
        - echo "Preparing frontend..."
    build:
      commands:
        - echo "Static frontend - no build required"
  artifacts:
    baseDirectory: frontend
    files:
      - '**/*'
  cache:
    paths: []
